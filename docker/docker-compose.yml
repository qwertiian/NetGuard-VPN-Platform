# NetGuard VPN - Docker Compose Configuration
#
# Usage:
#   docker compose up -d
#   docker compose exec netguard ngvpn server init --endpoint <your-ip>
#   docker compose exec netguard ngvpn server start
#   docker compose exec netguard ngvpn client add <name>
#
# Requirements:
#   - Docker with compose v2
#   - Host kernel must support WireGuard (Linux 5.6+)
#
# Notes:
#   - NET_ADMIN capability is required for network interface management
#   - SYS_MODULE capability is required for loading WireGuard kernel module
#   - IP forwarding sysctl is set for VPN routing
#   - Port 51820/UDP must be accessible from clients

services:
  netguard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netguard-vpn
    # Required Linux capabilities for WireGuard
    cap_add:
      - NET_ADMIN     # Network interface management
      - SYS_MODULE    # Kernel module loading (WireGuard)
    # Enable IP forwarding for VPN routing
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    # Expose WireGuard UDP port
    ports:
      - "51820:51820/udp"
    # Persistent storage for configuration and keys
    volumes:
      - netguard-data:/etc/netguard
      - wireguard-config:/etc/wireguard
    # Auto-restart on failure
    restart: unless-stopped
    # Override to keep container running for exec commands
    command: ["server", "status"]
    # Health check
    healthcheck:
      test: ["CMD", "ngvpn", "doctor"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  netguard-data:
    driver: local
  wireguard-config:
    driver: local
