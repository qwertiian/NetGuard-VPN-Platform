# ============================================================
# NetGuard VPN - Full Tunnel Client Configuration
# ============================================================
# Mode: Full Tunnel
# ALL traffic (internet + private) routes through the VPN server.
#
# Use case:
#   - Privacy on untrusted networks (cafes, hotels, airports)
#   - Hiding your IP from destination servers
#   - Accessing geo-restricted content via your server's location
#
# Generated by: ngvpn client export <name>
# WARNING: This file contains your private key. Keep it secure!
# Do NOT share this file or commit it to version control.

[Interface]
# Your unique private key (keep secret!)
PrivateKey = <CLIENT_PRIVATE_KEY>

# Your VPN IP address
Address = 10.77.0.2/32

# DNS servers used while VPN is active
DNS = 1.1.1.1, 9.9.9.9

[Peer]
# Server's public key
PublicKey = <SERVER_PUBLIC_KEY>

# Optional pre-shared key for additional security
PresharedKey = <PRESHARED_KEY>

# Server address and port
Endpoint = vpn.example.com:51820

# Route ALL traffic through VPN
# 0.0.0.0/0 = all IPv4 traffic
AllowedIPs = 0.0.0.0/0

# Send keepalive every 25 seconds to maintain NAT mappings
PersistentKeepalive = 25
